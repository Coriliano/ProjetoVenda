<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Vendedor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="seller-page">

    <div class="seller-container">

        <h1 class="seller-title">
            Insira os dados do vendedor
        </h1>

        <div class="seller-box">

            <form>

                <div class="mb-4">

                    <label class="seller-label">
                        Nome do vendedor
                    </label>

                    <input type="text" class="form-control seller-input">

                </div>

                <div class="mb-4">

                    <label class="seller-label">
                        Contato do vendedor
                    </label>

                    <input type="text" class="form-control seller-input">

                </div>

                <div class="mb-5">

                    <label class="seller-label">
                        Equipe do vendedor
                    </label>

                    <select class="form-select seller-input">

                        <option></option>

                        <option>
                            Equipe Norte
                        </option>

                        <option>
                            Equipe Sul
                        </option>

                    </select>

                </div>

                <div class="text-center">

                    <a href="home.html" class="btn seller-btn">
                        Cadastrar vendedor
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
