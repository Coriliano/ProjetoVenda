<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="container text-center">
        <h2 class="title-text mb-4">Insira os dados do cliente</h2>
        
        <div class="card-cadastro mx-auto">
            <form>
                <div class="mb-4">
                    <label for="empresa" class="form-label">Nome da empresa</label>
                    <input type="text" class="form-control custom-input" id="empresa">
                </div>
                
                <div class="mb-4">
                    <label for="contato" class="form-label">Nome do contato</label>
                    <input type="text" class="form-control custom-input" id="contato">
                </div>

                <div class="mb-4">
                    <label for="numero" class="form-label">Número do contato</label>
                    <input type="tel" class="form-control custom-input" id="numero">
                </div>

                <div class="mt-5">
                    <a href="sucesso.html" class="btn btn-cadastrar">Cadastrar cliente</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
