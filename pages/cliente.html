<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="client-page">

    <div class="container text-center">

        <h2 class="title-text">
            Insira os dados do cliente
        </h2>

        <div class="card-cadastro mx-auto">

            <form action="php/cadastrar_cliente.php" method="POST">

                <div class="mb-4">

                    <label class="form-label">
                        Nome da empresa
                    </label>

                    <input 
                        type="text" 
                        class="form-control custom-input"
                        name="empresa"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Nome do contato
                    </label>

                    <input 
                        type="text" 
                        class="form-control custom-input"
                        name="contato"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Número do contato
                    </label>

                    <input 
                        type="tel" 
                        class="form-control custom-input"
                        name="numero"
                        required
                    >

                </div>

                <div class="mt-5">

                    <button type="submit" class="btn btn-cadastrar">
                        Cadastrar cliente
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
