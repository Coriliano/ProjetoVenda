<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Venda</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="sale-page">

    <div class="sale-container">

        <h1 class="sale-title">
            Insira os dados da venda
        </h1>

        <div class="sale-box">

            <form>

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label class="sale-label">
                            Data da venda
                        </label>

                        <input type="date" class="form-control sale-input">

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="sale-label">
                            Quantidade vendida
                        </label>

                        <input type="number" class="form-control sale-input">

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="sale-label">
                            Valor da venda
                        </label>

                        <input type="number" class="form-control sale-input">

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="sale-label">
                            Vendedor responsável
                        </label>

                        <select class="form-select sale-input">

                            <option></option>

                            <option>
                                João
                            </option>

                            <option>
                                Maria
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-5">

                        <label class="sale-label">
                            Produto vendido
                        </label>

                        <select class="form-select sale-input">

                            <option></option>

                            <option>
                                Notebook
                            </option>

                            <option>
                                Mouse
                            </option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-5">

                        <label class="sale-label">
                            Cliente da venda
                        </label>

                        <select class="form-select sale-input">

                            <option></option>

                            <option>
                                Cliente 1
                            </option>

                            <option>
                                Cliente 2
                            </option>

                        </select>

                    </div>

                </div>

                <div class="text-center">

                    <a href="home.html" class="btn sale-btn">
                        Cadastrar venda
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
