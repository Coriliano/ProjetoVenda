<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Equipe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="team-page">

    <div class="container team-container text-center">

        <h1 class="team-title">
            Insira os dados da equipe
        </h1>

        <div class="team-box">

            <form action="php/cadastrar_equipe.php" method="POST">

                <div class="mb-4">

                    <label class="team-label">
                        Nome da equipe
                    </label>

                    <input 
                        type="text" 
                        class="form-control team-input"
                        name="nomeEquipe"
                        required
                    >

                </div>

                <div class="mb-5">

                    <label class="team-label">
                        Região da equipe
                    </label>

                    <input 
                        type="text" 
                        class="form-control team-input"
                        name="regiaoEquipe"
                        required
                    >

                </div>

                <div class="text-center">

                    <button type="submit" class="btn team-btn">
                        Cadastrar equipe
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
